[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartstock-ai"
version = "0.1.0"
description = "Retail demand forecasting and inventory decision-support system"
readme = "README.md"
requires-python = ">=3.11,<3.14"

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
